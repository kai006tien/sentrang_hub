<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sen Trắng Hub — Hệ thống Quản trị Nội bộ</title>
    <meta name="description" content="Hệ thống quản trị nội bộ CLB Thanh niên Tình nguyện Sen Trắng">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a3a2a 50%, #0d2818 100%);
            color: #e8f5e9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .logo { font-size: 4rem; margin-bottom: 1rem; }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #81c784, #fff9c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle { color: #a5d6a7; font-size: 1.1rem; margin-bottom: 2rem; }
        .status {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            border: 1px solid #4caf50;
            border-radius: 2rem;
            color: #4caf50;
            font-size: 0.9rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌸</div>
        <h1>Sen Trắng Hub</h1>
        <p class="subtitle">Hệ thống Quản trị Nội bộ — CLB Thanh niên Tình nguyện</p>
        <div class="status">🚀 Đang phát triển...</div>
    </div>
</body>
</html>
