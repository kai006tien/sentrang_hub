<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập — Sen Trắng Hub</title>
  <meta name="description" content="Hệ thống quản trị nội bộ CLB Thanh niên Tình nguyện Sen Trắng">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
</head>
<body>

  <!-- Animated Mesh Background -->
  <div class="bg-mesh"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="logo-icon">🌸</div>
          <div>
            <h1 class="auth-title">Sen Trắng Hub</h1>
            <p class="auth-subtitle">Cổng quản trị nội bộ CLB Tình nguyện</p>
          </div>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email đăng nhập</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="form-input" placeholder="admin@sentranghub.vn" required autocomplete="email">
            <span class="input-icon">✉</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mật khẩu</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <span class="input-icon">🔒</span>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">
          <span>Đăng nhập hệ thống</span>
          <span>➔</span>
        </button>
      </form>

      <!-- Demo Box -->
      <div class="demo-box">
        <strong>Tài khoản Super Admin mặc định:</strong><br>
        Email: <code>admin@sentranghub.vn</code><br>
        Mật khẩu: <code>SenTrang@2026!</code>
      </div>
    </div>
  </div>

  <!-- JavaScript Modules -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Chuyển hướng nếu đã đăng nhập
      Auth.redirectIfAuthenticated();

      const form = document.getElementById('login-form');
      const btnSubmit = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<span>Đang xác thực...</span>`;

        try {
          await Auth.login(email, password);
        } catch (err) {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = `<span>Đăng nhập hệ thống</span> <span>➔</span>`;
        }
      });
    });
  </script>
</body>
</html>
