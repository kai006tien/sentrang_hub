<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Đăng nhập — Sen Trắng Hub</title>
  <meta name="description" content="Hệ thống quản trị nội bộ CLB Thanh niên Tình nguyện Sen Trắng — Đăng nhập để truy cập hệ thống">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20.0">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body class="login-page">

  <!-- Aurora Background Effects -->
  <div class="login-bg-overlay">
    <div class="login-decoration login-decoration--trongdong"></div>
    <div class="glow-spotlight glow-spotlight--top"></div>
    <div class="glow-spotlight glow-spotlight--bottom"></div>
  </div>

  <div class="login-wrapper">
    <!-- Header -->
    <header class="login-header animate-fadeInDown" style="margin-bottom:1.25rem;">
      <div class="login-header__logo-container" style="margin-bottom:1rem;">
        <div class="app-logo-badge app-logo-badge--login">
          <img src="assets/images/logo.png" alt="Sen Trắng Logo">
        </div>
      </div>
      <h1 class="login-header__title">SEN TRẮNG HUB</h1>
      <p class="login-header__subtitle">
        HỆ THỐNG QUẢN TRỊ & QUẢN LÝ NỘI BỘ –<br>
        CLB THANH NIÊN TÌNH NGUYỆN SEN TRẮNG
      </p>
    </header>

    <!-- Login Card -->
    <main class="login-container animate-fadeInUp">
      <div class="login-card">
        <div class="login-card__top-bar"></div>
        <h2 class="login-card__title">Đăng nhập</h2>
        <p class="login-card__desc">Nhập thông tin tài khoản để truy cập hệ thống quản trị</p>

        <!-- Error Banner -->
        <div class="login-error" id="login-error" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
          <span id="login-error-text">Email hoặc mật khẩu không chính xác.</span>
        </div>

        <!-- Form -->
        <form class="login-form" id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email đăng nhập</label>
            <div class="input-icon-wrapper">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <input class="form-input" type="email" id="email" placeholder="admin@sentranghub.vn" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Mật khẩu</label>
            <div class="input-icon-wrapper">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="toggle-password" id="btn-toggle-password" title="Hiện/Ẩn mật khẩu">
                <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btn-submit">
            <span>Đăng nhập hệ thống</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-arrow">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="login-footer">
      <p>© 2026 CLB Thanh niên Tình nguyện Sen Trắng.<br>Tất cả quyền được bảo lưu.</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="assets/js/config.js?v=20.0"></script>
  <script src="assets/js/api.js?v=20.0"></script>
  <script src="assets/js/auth.js?v=20.0"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.redirectIfAuthenticated();

      const form = document.getElementById('login-form');
      const btnSubmit = document.getElementById('btn-submit');
      const emailInput = document.getElementById('email');
      const passInput = document.getElementById('password');
      const btnTogglePass = document.getElementById('btn-toggle-password');
      const errorBox = document.getElementById('login-error');
      const errorText = document.getElementById('login-error-text');

      // Toggle Show/Hide Password
      if (btnTogglePass && passInput) {
        btnTogglePass.addEventListener('click', () => {
          const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passInput.setAttribute('type', type);
          btnTogglePass.classList.toggle('active');
        });
      }

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';

        const email = emailInput.value.trim();
        const password = passInput.value;

        btnSubmit.disabled = true;
        btnSubmit.classList.add('loading');
        btnSubmit.innerHTML = `
          <svg class="spinner" viewBox="0 0 50 50">
            <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
          </svg>
          <span>Đang xác thực...</span>
        `;

        try {
          await Auth.login(email, password);
        } catch (err) {
          btnSubmit.disabled = false;
          btnSubmit.classList.remove('loading');
          btnSubmit.innerHTML = `
            <span>Đăng nhập hệ thống</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="btn-arrow">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          `;

          errorText.textContent = err.message || 'Đăng nhập thất bại. Vui lòng kiểm tra lại email/mật khẩu.';
          errorBox.style.display = 'flex';
        }
      });
    });
  </script>
</body>
</html>
